<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Background is transparent for a clean favicon -->
  <style>
    .purple { fill: #4a154b; }
    .cream { fill: #FAF6EB; }
    .green { fill: #1E6B3F; }
    .gold { fill: #D19A2A; }
  </style>

  <g transform="translate(256, 256)">
    <!-- 1. Outer Royal Purple Scalloped Diamond Frame -->
    <path class="purple" d="
      M 0 -236 
      Q 26 -200 48 -180 
      Q 110 -195 140 -140
      Q 195 -110 180 -48
      Q 200 -26 236 0
      Q 200 26 180 48
      Q 195 110 140 140
      Q 110 195 48 180
      Q 26 200 0 236
      Q -26 200 -48 180
      Q -110 195 -140 140
      Q -195 110 -180 48
      Q -200 26 -236 0
      Q -200 -26 -180 -48
      Q -195 -110 -140 -140
      Q -110 -195 -48 -180
      Q -26 -200 0 -236 Z" />

    <!-- 2. Inner Cream Scalloped Diamond Frame (offset slightly inside) -->
    <path class="cream" d="
      M 0 -214 
      Q 23 -180 43 -162 
      Q 98 -175 125 -125
      Q 175 -98 162 -43
      Q 180 -23 214 0
      Q 180 23 162 43
      Q 175 98 125 125
      Q 98 175 43 162
      Q 23 180 0 214
      Q -23 180 -43 162
      Q -98 175 -125 125
      Q -175 98 -162 43
      Q -180 23 -214 0
      Q -180 -23 -162 -43
      Q -175 -98 -125 -125
      Q -98 -175 -43 -162
      Q -23 -180 0 -214 Z" />

    <!-- 3. Inner Purple Outline tracking the shape -->
    <path fill="none" stroke="#4a154b" stroke-width="8" d="
      M 0 -192 
      Q 20 -160 38 -144 
      Q 86 -155 110 -110
      Q 155 -86 144 -38
      Q 160 -20 192 0
      Q 160 20 144 38
      Q 155 86 110 110
      Q 86 155 38 144
      Q 20 160 0 192
      Q -20 160 -38 144
      Q -86 155 -110 110
      Q -155 86 -144 38
      Q -160 20 -192 0
      Q -160 -20 -144 -38
      Q -155 -86 -110 -110
      Q -86 -155 -38 -144
      Q -20 -160 0 -192 Z" />

    <!-- 4. Corner/Diagonal Mustard Gold Accents -->
    <!-- Top-Right Gold rot -->
    <path class="gold" d="M 68 -68 C 95 -95, 115 -75, 88 -48 C 68 -28, 48 -48, 68 -68 Z" transform="rotate(0)" />
    <!-- Bottom-Right Gold rot -->
    <path class="gold" d="M 68 -68 C 95 -95, 115 -75, 88 -48 C 68 -28, 48 -48, 68 -68 Z" transform="rotate(90)" />
    <!-- Bottom-Left Gold rot -->
    <path class="gold" d="M 68 -68 C 95 -95, 115 -75, 88 -48 C 68 -28, 48 -48, 68 -68 Z" transform="rotate(180)" />
    <!-- Top-Left Gold rot -->
    <path class="gold" d="M 68 -68 C 95 -95, 115 -75, 88 -48 C 68 -28, 48 -48, 68 -68 Z" transform="rotate(270)" />

    <!-- 5. Emerald Green Leaves (8-way symmetry: 4 major axes + 4 diagonal axes) -->
    <!-- Major Axes Green Leaves (Larger, pointing Up, Down, Left, Right) -->
    <!-- Top Leaf -->
    <path class="green" d="M 0 -150 C -25 -100, -20 -50, 0 -30 C 20 -50, 25 -100, 0 -150 Z" />
    <!-- Bottom Leaf -->
    <path class="green" d="M 0 150 C -25 100, -20 50, 0 30 C 20 50, 25 100, 0 150 Z" />
    <!-- Right Leaf -->
    <path class="green" d="M 150 0 C 100 -25, 50 -20, 30 0 C 50 20, 100 25, 150 0 Z" />
    <!-- Left Leaf -->
    <path class="green" d="M -150 0 C -100 -25, -50 -20, -30 0 C -50 20, -100 25, -150 0 Z" />

    <!-- Diagonal Green Leaves (Slightly shorter, pointing 45deg, 135deg, 225deg, 315deg) -->
    <g transform="rotate(45)">
      <path class="green" d="M 0 -115 C -18 -80, -15 -40, 0 -22 C 15 -40, 18 -80, 0 -115 Z" />
      <path class="green" d="M 0 115 C -18 80, -15 40, 0 22 C 15 40, 18 80, 0 115 Z" />
      <path class="green" d="M 115 0 C 80 -18, 40 -15, 22 0 C 40 18, 80 15, 115 0 Z" />
      <path class="green" d="M -115 0 C -80 -18, -40 -15, -22 0 C -40 18, -80 15, -115 0 Z" />
    </g>

    <!-- 6. Central Royal Purple Flower Petals (Propeller/Cross style) -->
    <g transform="rotate(22.5)">
      <!-- Petal 1 -->
      <path class="purple" d="M 0 -38 C -15 -25, -15 -5, 0 0 C 15 -5, 15 -25, 0 -38 Z" />
      <!-- Petal 2 -->
      <path class="purple" d="M 0 38 C -15 25, -15 5, 0 0 C 15 5, 15 25, 0 38 Z" />
      <!-- Petal 3 -->
      <path class="purple" d="M 38 0 C 25 -15, 5 -15, 0 0 C 5 15, 25 15, 38 0 Z" />
      <!-- Petal 4 -->
      <path class="purple" d="M -38 0 C -25 -15, -5 -15, 0 0 C -5 15, -25 15, -38 0 Z" />
    </g>

    <!-- Central core tiny dots or decorative center -->
    <circle cx="0" cy="0" r="5" fill="#FAF6EB" />
  </g>
</svg>
