<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Symmetrical Moroccan Tile Favicon for Douaa & Basma -->
  <defs>
    <!-- Shadow for luxury depth effect -->
    <filter id="subtle-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#561C76" flood-opacity="0.08"/>
    </filter>
    
    <!-- One-quarter of the inner symmetrical elements (Leaves and Seeds) -->
    <g id="quarter-element">
      <!-- 1. Major Green Leaf (straight up on vertical axis, shared/split or offset) -->
      <!-- We project a full vertical leaf with a slight offset or draw half-leaves -->
      <path d="M 256 256 C 244 190, 242 145, 256 100 C 270 145, 268 190, 256 256 Z" fill="#2E4F32" />
      
      <!-- 2. Diagonal Green Leaf (oriented at 45 degrees) -->
      <path d="M 256 256 C 285 200, 320 180, 350 162 C 332 192, 312 227, 256 256 Z" fill="#2E4F32" />
      
      <!-- 3. Mustard Gold Teardrop/Seed Accent (oriented at 45 degrees, positioned further out) -->
      <path d="M 368 144 C 378 136, 386 128, 396 142 C 382 152, 374 160, 368 144 Z" fill="#C19641" />
      <!-- Stylized Mustard Gold Seed close to center axis -->
      <path d="M 296 172 C 304 168, 312 178, 304 186 C 294 188, 290 178, 296 172 Z" fill="#C19641" />
    </g>
  </defs>

  <!-- Ground circle with warm off-white, precisely matching user's image background -->
  <circle cx="256" cy="256" r="248" fill="#FDFCF7" />

  <!-- Outer deep purple scalloped tile contour, completely symmetrical and handcrafted -->
  <g filter="url(#subtle-shadow)">
    <!-- Main purple background layer -->
    <path d="M 256 24 
             C 278 65, 282 85, 308 102
             C 324 112, 342 102, 358 114
             C 378 128, 382 154, 408 180
             C 426 198, 446 202, 458 214
             C 475 230, 488 238, 488 256
             C 488 274, 475 282, 458 298
             C 446 310, 426 314, 408 332
             C 382 358, 378 384, 358 398
             C 342 410, 324 400, 308 410
             C 282 427, 278 447, 256 488
             C 234 447, 230 427, 204 410
             C 188 400, 170 410, 154 398
             C 134 384, 130 358, 104 332
             C 86 314, 66 310, 54 298
             C 37 282, 24 274, 24 256
             C 24 238, 37 230, 54 214
             C 66 202, 86 198, 104 180
             C 130 154, 134 128, 154 114
             C 170 102, 188 112, 204 102
             C 230 85, 234 65, 256 24 Z" 
          fill="#561C76" />

    <!-- Inner off-white layer to create the scalloped thick border of negative space -->
    <path d="M 256 44 
             C 274 81, 278 99, 302 114
             C 316 122, 332 114, 346 124
             C 364 136, 368 159, 391 182
             C 407 198, 425 201, 435 211
             C 450 226, 462 233, 462 256
             C 462 279, 450 286, 435 301
             C 425 311, 407 314, 391 330
             C 368 353, 364 376, 346 388
             C 332 398, 316 390, 302 398
             C 278 413, 274 431, 256 468
             C 238 431, 234 413, 210 398
             C 196 390, 180 398, 166 388
             C 148 376, 144 353, 121 330
             C 105 314, 87 311, 77 301
             C 62 286, 50 279, 50 256
             C 50 233, 62 226, 77 211
             C 87 201, 105 198, 121 182
             C 144 159, 148 136, 166 124
             C 180 114, 196 122, 210 114
             C 234 99, 238 81, 256 44 Z" 
          fill="#FDFCF7" />
  </g>

  <!-- Central floral structure with exact color palette -->
  <g id="central-florals">
    <!-- 4 Rotated groups of green leaves and gold accents -->
    <use href="#quarter-element" transform="rotate(0 256 256)" />
    <use href="#quarter-element" transform="rotate(90 256 256)" />
    <use href="#quarter-element" transform="rotate(180 256 256)" />
    <use href="#quarter-element" transform="rotate(270 256 256)" />
    
    <!-- Central Plum Purple four-petal center flower -->
    <g id="center-plug" fill="#561C76">
      <path d="M 256 256 C 246 230, 230 246, 256 220 C 282 246, 266 230, 256 256 Z" transform="rotate(45 256 256)" />
      <path d="M 256 256 C 246 230, 230 246, 256 220 C 282 246, 266 230, 256 256 Z" transform="rotate(135 256 256)" />
      <path d="M 256 256 C 246 230, 230 246, 256 220 C 282 246, 266 230, 256 256 Z" transform="rotate(225 256 256)" />
      <path d="M 256 256 C 246 230, 230 246, 256 220 C 282 246, 266 230, 256 256 Z" transform="rotate(315 256 256)" />
    </g>
  </g>
</svg>
