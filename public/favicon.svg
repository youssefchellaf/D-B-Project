<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Professional background gradient blending Premium Purple and Moroccan Green -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#561C76" />
      <stop offset="35%" stop-color="#3c1353" />
      <stop offset="65%" stop-color="#1c3621" />
      <stop offset="100%" stop-color="#2E4F32" />
    </linearGradient>

    <!-- Professional 3D-like Gold Metallic gradient for the juice cup & elements -->
    <linearGradient id="goldGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#B8860B" />
      <stop offset="30%" stop-color="#F2C542" />
      <stop offset="70%" stop-color="#FFD700" />
      <stop offset="100%" stop-color="#FFF2B2" />
    </linearGradient>
  </defs>

  <!-- Circular Purple-Green Gradient Background -->
  <circle cx="256" cy="256" r="236" fill="url(#bgGrad)" />
  
  <!-- Premium Golden Juice Glass and Straw Design -->
  <!-- Straw -->
  <path d="M235 250 L315 80 L355 95" 
        fill="none" 
        stroke="url(#goldGrad)" 
        stroke-width="28" 
        stroke-linecap="round" 
        stroke-linejoin="round" />

  <!-- Cup Body -->
  <path d="M180 190 L332 190 L295 400 Q290 420 270 420 L242 420 Q222 420 217 400 Z" 
        fill="url(#goldGrad)" />

  <!-- Glass Rim Highlight (Visual cutout using background gradient) -->
  <path d="M190 205 L322 205" 
        fill="none" 
        stroke="url(#bgGrad)" 
        stroke-width="12" 
        stroke-linecap="round" />

  <!-- Lemon/Orange Slice on Rim -->
  <circle cx="165" cy="180" r="44" fill="url(#goldGrad)" stroke="url(#bgGrad)" stroke-width="10" />
  <!-- Slice Segments -->
  <line x1="165" y1="180" x2="165" y2="136" stroke="url(#bgGrad)" stroke-width="6" />
  <line x1="165" y1="180" x2="127" y2="202" stroke="url(#bgGrad)" stroke-width="6" />
  <line x1="165" y1="180" x2="203" y2="202" stroke="url(#bgGrad)" stroke-width="6" />
  <line x1="165" y1="180" x2="193" y2="148" stroke="url(#bgGrad)" stroke-width="6" />
  <line x1="165" y1="180" x2="137" y2="148" stroke="url(#bgGrad)" stroke-width="6" />

  <!-- Playful Juice Bubbles/Droplets on the right -->
  <circle cx="345" cy="210" r="16" fill="url(#goldGrad)" />
  <circle cx="365" cy="250" r="10" fill="url(#goldGrad)" />
</svg>
