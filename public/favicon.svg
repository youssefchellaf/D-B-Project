<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Professional background gradient blending Moroccan Green and Premium Purple (Reversed colorway) -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1F4224" />
      <stop offset="35%" stop-color="#122A16" />
      <stop offset="65%" stop-color="#2D0D3D" />
      <stop offset="100%" stop-color="#4B1565" />
    </linearGradient>

    <!-- Professional 3D-like Gold Metallic gradient for the juice. Clear, vibrant, and elegant. -->
    <linearGradient id="goldGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#B8860B" />
      <stop offset="25%" stop-color="#D4AF37" />
      <stop offset="50%" stop-color="#FFD700" />
      <stop offset="75%" stop-color="#FCE68A" />
      <stop offset="100%" stop-color="#FFF8DC" />
    </linearGradient>
    
    <!-- Plastic highlight gradient to give it a glass/plastic reflection -->
    <linearGradient id="plasticSpecular" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.6"/>
      <stop offset="15%" stop-color="#ffffff" stop-opacity="0.2"/>
      <stop offset="60%" stop-color="#ffffff" stop-opacity="0.0"/>
      <stop offset="85%" stop-color="#ffffff" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.4"/>
    </linearGradient>

    <!-- Semi-transparent gold for the plastic cup itself -->
    <linearGradient id="cupOutline" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFD700" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#B8860B" stop-opacity="0.8"/>
    </linearGradient>
  </defs>

  <!-- Circular Outer Background with Royal Purple and Deep Moroccan Green -->
  <circle cx="256" cy="256" r="236" fill="url(#bgGrad)" />
  
  <!-- Outer Gold Ring for prestige/quality -->
  <circle cx="256" cy="256" r="230" fill="none" stroke="url(#goldGrad)" stroke-width="6" opacity="0.85" />

  <!-- The Cup Base Shadow for 3D realism -->
  <ellipse cx="256" cy="415" rx="75" ry="18" fill="#111111" opacity="0.5" />

  <!-- The Juice itself inside the cup (tapered plastic cup shape) -->
  <path d="M 185,225 L 327,225 L 297,390 Q 295,400 285,400 L 227,400 Q 217,400 215,390 Z" 
        fill="url(#goldGrad)" />

  <!-- Modern Plastic Cup Outline / Body -->
  <!-- It has ribs/lines characteristic of professional takeout plastic cups -->
  <path d="M 180,210 L 332,210 L 297,395 Q 295,410 280,410 L 232,410 Q 217,410 215,395 Z" 
        fill="none" 
        stroke="url(#cupOutline)" 
        stroke-width="12" 
        stroke-linejoin="round" />

  <!-- Rib 1 (Visual rib of plastic cup) -->
  <path d="M 194,275 L 318,275" fill="none" stroke="url(#cupOutline)" stroke-width="5" opacity="0.75" />
  <!-- Rib 2 (Visual rib of plastic cup) -->
  <path d="M 203,320 L 309,320" fill="none" stroke="url(#cupOutline)" stroke-width="5" opacity="0.75" />
  <!-- Rib 3 (Visual rib of plastic cup) -->
  <path d="M 211,360 L 301,360" fill="none" stroke="url(#cupOutline)" stroke-width="5" opacity="0.75" />

  <!-- Dome Lid: Professional circular transparent/golden dome typical of takeout cups -->
  <!-- Half-circle or Q-arc path for the dome top -->
  <path d="M 170,210 Q 170,135 256,135 Q 342,135 342,210 Z" 
        fill="url(#goldGrad)" 
        opacity="0.25" />
  
  <path d="M 170,210 Q 170,135 256,135 Q 342,135 342,210 Z" 
        fill="none" 
        stroke="url(#cupOutline)" 
        stroke-width="10" />

  <!-- Dome Rim (The flat lip of the lid) -->
  <rect x="160" y="200" width="192" height="15" rx="7" fill="url(#goldGrad)" stroke="url(#cupOutline)" stroke-width="3" />

  <!-- Plastic Specular Reflection Overlay across the entire cup/lid -->
  <path d="M 180,210 L 332,210 L 297,395 Q 295,410 280,410 L 232,410 Q 217,410 215,395 Z" 
        fill="url(#plasticSpecular)" />



  <!-- Ice cubes / bubbles inside the golden drink for high fidelity -->
  <!-- Bubble 1 -->
  <circle cx="225" cy="270" r="12" fill="#FFFFFF" opacity="0.5" />
  <circle cx="222" cy="267" r="4" fill="#FFFFFF" opacity="0.8" />
  <!-- Bubble 2 -->
  <circle cx="280" cy="250" r="14" fill="#FFFFFF" opacity="0.35" />
  <circle cx="276" cy="246" r="5" fill="#FFFFFF" opacity="0.6" />
  <!-- Bubble 3 -->
  <circle cx="250" cy="330" r="10" fill="#FFFFFF" opacity="0.4" />
  <!-- Splashy Droplets or sparkles on the side of the logo -->
  <path d="M 370,220 Q 380,210 375,200 Q 365,210 370,220 Z" fill="url(#goldGrad)" />
  <path d="M 385,250 Q 395,245 392,235 Q 382,242 385,250 Z" fill="url(#goldGrad)" />
</svg>
