  <body>
    <div id="root">
      <!-- Elegant Arabesque Brand Initial Loading Screen -->
      <div class="luxury-loader-container">
        <div class="luxury-loader-content">
          <!-- Pulsating Luxury Glass Favicon (Matching favicon exactly: Golden Cup, No Straw, Green-Purple background) -->

          </div>

          <!-- Dynamic glowing spinner tracking circle around logo -->

          <!-- Premium Brand Calligraphy -->
          <h1 class="luxury-brand-title">دعاء وبسمة</h1>
          <h2 class="luxury-brand-subtitle">Douaa &amp; Basma</h2>

          <!-- Glowing Loading Progress Badge -->
          <div class="luxury-progress-indicator">
            <span class="luxury-progress-dot"></span>
            <span class="luxury-progress-text">جاري التحميل...</span>
          </div>
        </div>
      </div>

      <style>
        /* Stylized Waiting Room Background containing Morocco Green to Dark Royal Purple */
        .luxury-loader-container {
          position: fixed;
          inset: 0;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          background: radial-gradient(circle at center, #1F4224 0%, #122A16 40%, #2D0D3D 85%, #1F1128 100%);
          font-family: "Tajawal", "Inter", system-ui, -apple-system, sans-serif;
          z-index: 99999;
          overflow: hidden;
        }

        /* Luxury glowing background overlays */
        .luxury-loader-container::before {
          content: '';
          position: absolute;
          width: 450px;
          height: 450px;
          border-radius: 50%;
          background: radial-gradient(circle, rgba(193, 150, 65, 0.15) 0%, transparent 70%);
          filter: blur(80px);
          animation: ambientAura 8s ease-in-out infinite alternate;
          top: 15%;
          left: 20%;
        }
        .luxury-loader-container::after {
          content: '';
          position: absolute;
          width: 350px;
          height: 350px;
          border-radius: 50%;
          background: radial-gradient(circle, rgba(126, 49, 162, 0.18) 0%, transparent 70%);
          filter: blur(80px);
          animation: ambientAura 10s ease-in-out infinite alternate-reverse;
          bottom: 15%;
          right: 20%;
        }

        .luxury-loader-content {
          position: relative;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          text-align: center;
          z-index: 10;
          padding: 30px;
        }

        /* Pulsator for the Cup design */
        .luxury-glass-wrapper {
          position: relative;
          width: 130px;
          height: 130px;
          margin-bottom: 28px;
          display: flex;
          align-items: center;
          justify-content: center;
          animation: cupBounceSlow 3s ease-in-out infinite;
        }

        .luxury-glass-svg {
          width: 100%;
          height: 100%;
          filter: drop-shadow(0 8px 30px rgba(193, 150, 65, 0.25));
        }

        /* Orbiting track ring */
        .luxury-spinner-ring {
          position: absolute;
          top: -15px;
          width: 160px;
          height: 160px;
          border: 2px solid rgba(255, 215, 0, 0.05);
          border-top: 2px solid #C19641;
          border-right: 2.5px solid rgba(255, 215, 0, 0.2);
          border-radius: 50%;
          animation: spinCoordinated 1.6s cubic-bezier(0.4, 0.1, 0.2, 0.9) infinite;
        }

        /* Branding Typography */
        .luxury-brand-title {
          font-size: 34px;
          font-weight: 900;
          margin: 10px 0 2px 0;
          letter-spacing: -0.5px;
          color: #FAF9F6;
          background: linear-gradient(135deg, #FAF9F6 0%, #E9D2A3 45%, #C19641 100%);
          -webkit-background-clip: text;
          -webkit-text-fill-color: transparent;
          filter: drop-shadow(0 2px 10px rgba(0,0,0,0.3));
        }

        .luxury-brand-subtitle {
          font-size: 15px;
          font-weight: 600;
          color: rgba(233, 210, 163, 0.7);
          margin-bottom: 32px;
          letter-spacing: 3px;
          text-transform: uppercase;
        }

        /* Loading indicator panel */
        .luxury-progress-indicator {
          display: inline-flex;
          align-items: center;
          gap: 12px;
          background: rgba(18, 42, 22, 0.4);
          border: 1px solid rgba(193, 150, 65, 0.25);
          padding: 10px 24px;
          border-radius: 99px;
          backdrop-filter: blur(12px);
          -webkit-backdrop-filter: blur(12px);
          box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }

        .luxury-progress-dot {
          width: 8px;
          height: 8px;
          background-color: #C19641;
          border-radius: 50%;
          animation: dotGlowPulse 1.4s ease-in-out infinite;
          box-shadow: 0 0 10px #C19641;
        }

        .luxury-progress-text {
          font-size: 13px;
          font-weight: 700;
          color: #FAF9F6;
          letter-spacing: 0.3px;
        }

        /* Dynamic Animations */
        @keyframes spinCoordinated {
          0% { transform: rotate(0deg); }
          100% { transform: rotate(360deg); }
        }

        @keyframes cupBounceSlow {
          0%, 100% {
            transform: scale(0.97) translateY(0);
          }
          50% {
            transform: scale(1.03) translateY(-6px);
          }
        }

        @keyframes ambientAura {
          0% { transform: scale(0.95) translate(0px, 0px); opacity: 0.4; }
          100% { transform: scale(1.15) translate(25px, 15px); opacity: 0.8; }
        }

        @keyframes dotGlowPulse {
          0%, 100% { transform: scale(0.85); opacity: 0.6; box-shadow: 0 0 6px #C19641; }
          50% { transform: scale(1.25); opacity: 1; box-shadow: 0 0 15px #FFD700; }
        }
      </style>
